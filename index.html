<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hatchpile</title>
<meta name="description" content="Drop eggs. Merge critters. Hatch the Dragon. A new puzzle every day.">
<meta property="og:title" content="Hatchpile">
<meta property="og:description" content="Drop eggs. Merge critters. Hatch the Dragon. A new puzzle every day.">
<meta name="theme-color" content="#1b1430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
:root{--bg:#1b1430;--panel:#2a2046;--ink:#fff3e0;--accent:#ffb347;--accent2:#7ee0a0;--danger:#ff5e7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Pixelify Sans',system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border-radius:12px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,10,26,.74);backdrop-filter:blur(3px);padding:16px}
.overlay.hidden{display:none}
.card{background:var(--panel);border:3px solid #4a3a7a;border-radius:16px;padding:22px 20px;width:min(360px,100%);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
h1{font-size:46px;letter-spacing:2px;color:var(--accent);text-shadow:3px 3px 0 #7a3b1e;line-height:1}
h2{font-size:30px;color:var(--accent);letter-spacing:1px}
.tag{font-size:16px;opacity:.85;margin:8px 0 16px;line-height:1.35}
button{font:inherit;font-weight:700;font-size:20px;background:var(--accent);color:#3a1d08;border:0;border-radius:10px;padding:12px 18px;margin:5px 3px;cursor:pointer;box-shadow:0 4px 0 #a8651c;min-width:140px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8651c}
button.alt{background:var(--accent2);box-shadow:0 4px 0 #2f8a55;color:#0b2e1b}
button.alt:active{box-shadow:0 1px 0 #2f8a55}
button.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid #5a4a8a;font-size:16px;padding:8px 12px;min-width:0}
.big{font-size:44px;color:var(--accent);line-height:1.1}
.row{display:flex;justify-content:center;gap:16px;font-size:15px;opacity:.9;margin:10px 0}
.chain{font-size:22px;letter-spacing:3px;margin:10px 0;word-break:break-all;line-height:1.4}
.small{font-size:13px;opacity:.65;margin-top:10px;line-height:1.4}
.badge{display:inline-block;background:var(--danger);color:#fff;font-size:13px;padding:3px 8px;border-radius:6px;margin-bottom:6px;letter-spacing:1px}
#toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="menu" class="overlay">
    <div class="card">
      <h1>HATCHPILE</h1>
      <div class="tag">Drop eggs into the jar.<br>Two of a kind merge into something bigger.<br>Hatch the <b>Dragon</b>.</div>
      <button id="btnDaily" class="alt">Daily #1</button>
      <button id="btnEndless">Endless</button>
      <div class="row"><span id="menuBest">Best: 0</span><span id="menuDex">Critterdex 1/11</span></div>
      <div id="menuDaily" class="small"></div>
      <div class="small">Tap and drag to aim, release to drop<br>Keyboard: ← → aim, Space drop, M mute</div>
      <button id="btnMute" class="ghost">🔊 Sound on</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <div id="overBadge" class="badge" style="display:none">NEW BEST</div>
      <h2 id="overTitle">GAME OVER</h2>
      <div class="big" id="overScore">0</div>
      <div class="row"><span id="overMerges">0 merges</span><span id="overTop">Top: Egg</span></div>
      <div class="chain" id="overChain"></div>
      <button id="btnShare" class="alt">Share</button>
      <button id="btnAgain">Play again</button>
      <div><button id="btnMenu" class="ghost">Menu</button></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
(() => {
if (!window.Matter) { document.body.innerHTML = '<p style="padding:40px;text-align:center">Hatchpile needs an internet connection the first time it loads.</p>'; return; }
const { Engine, Bodies, Body, Composite, Events } = Matter;

const W = 440, H = 760;
const JAR = { l: 28, r: 412, top: 176, floor: 704 };
const DANGER_Y = 196, SPAWN_Y = 118, EPOCH = Date.UTC(2026, 9, 31);
const TIERS = [
  ['Egg', '🥚', 16, '#f3e9d2'], ['Slime', '🟢', 22, '#7ee0a0'], ['Shroomling', '🍄', 28, '#ff6b6b'],
  ['Bat', '🦇', 36, '#a77df2'], ['Frog', '🐸', 46, '#4fd1c5'], ['Cat', '🐱', 56, '#ffa94d'],
  ['Owl', '🦉', 66, '#c9a071'], ['Boar', '🐗', 78, '#8d6748'], ['Bear', '🐻', 90, '#a0522d'],
  ['Golem', '🗿', 104, '#8fa3b5'], ['Dragon', '🐉', 116, '#ff4757'],
].map(([name, emoji, r, color]) => ({ name, emoji, r, color }));
const TOP = TIERS.length - 1;
const VALUE = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66];

const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d');
const store = {
  get(k, d) { try { const v = localStorage.getItem('hp_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hp_' + k, JSON.stringify(v)); } catch {} },
};

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const pad = n => String(n).padStart(2, '0');
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dailyNumber() { const d = new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 864e5) + 1; }

function trimBox(img) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
  for (let py = 0; py < c.height; py++) for (let px = 0; px < c.width; px++) if (d[(py * c.width + px) * 4 + 3] > 20) {
    if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py;
  }
  if (maxX < 0) return { x: 0, y: 0, s: c.width };
  const w = maxX - minX + 1, h = maxY - minY + 1, s = Math.max(w, h);
  return { x: minX - (s - w) / 2, y: minY - (s - h) / 2, s };
}
const sprites = TIERS.map((t, i) => {
  const img = new Image(); img.src = `assets/c${pad(i)}.png`;
  img.onerror = () => { img.failed = true; };
  img.onload = () => { try { img.box = trimBox(img); } catch { img.box = { x: 0, y: 0, s: img.naturalWidth }; } };
  return img;
});

let audioCtx = null, muted = store.get('mute', false);
function beep(freq, dur, type = 'triangle', vol = 0.18, slide = 1) {
  if (muted || !audioCtx) return;
  const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  drop() { beep(180, 0.06, 'square', 0.08, 0.6); },
  merge(tier) { beep(260 * Math.pow(1.13, tier), 0.16, 'triangle', 0.2, 1.5); if (tier >= 5) beep(130 * Math.pow(1.13, tier), 0.25, 'sine', 0.15, 1.2); },
  ascend() { [0, 4, 7, 12, 16].forEach((n, i) => setTimeout(() => beep(330 * Math.pow(2, n / 12), 0.3, 'triangle', 0.22, 1.02), i * 90)); },
  over() { [0, -4, -9].forEach((n, i) => setTimeout(() => beep(220 * Math.pow(2, n / 12), 0.35, 'sawtooth', 0.12, 0.9), i * 180)); },
};

let engine, mode, rng, queue, held, aimX, canDropAt, score, best, merges, maxTier, combo, lastMergeT, gameOver, running;
let particles = [], floats = [], pending = [], shake = 0, dangerLevel = 0, dailyNo = dailyNumber();
let unlocked = store.get('unlocked', 1);

function nextTier() { const r = rng(); return r < .34 ? 0 : r < .62 ? 1 : r < .82 ? 2 : r < .94 ? 3 : 4; }
function makeCritter(x, y, tier, popped) {
  const b = Bodies.circle(x, y, TIERS[tier].r, { restitution: .12, friction: .3, frictionStatic: .5, density: .0012, label: 'critter' });
  b.tier = tier; b.born = performance.now(); b.overT = 0; b.popped = !!popped;
  Body.setAngle(b, (rng() - .5) * .6);
  return b;
}

function startGame(m) {
  mode = m;
  const seed = m === 'daily' ? hashStr('hatchpile-' + todayKey()) : (Math.random() * 2 ** 32) >>> 0;
  rng = mulberry32(seed);
  engine = Engine.create({ gravity: { x: 0, y: 1.15 } });
  const wallOpts = { isStatic: true, friction: .4, label: 'wall' };
  Composite.add(engine.world, [
    Bodies.rectangle(JAR.l - 20, (JAR.top + JAR.floor) / 2 - 150, 40, JAR.floor - JAR.top + 500, wallOpts),
    Bodies.rectangle(JAR.r + 20, (JAR.top + JAR.floor) / 2 - 150, 40, JAR.floor - JAR.top + 500, wallOpts),
    Bodies.rectangle(W / 2, JAR.floor + 20, W + 200, 40, wallOpts),
  ]);
  Events.on(engine, 'collisionStart', e => {
    for (const { bodyA: a, bodyB: b } of e.pairs) {
      if (a.label === 'critter' && b.label === 'critter' && a.tier === b.tier && !a.dead && !b.dead) { a.dead = b.dead = true; pending.push([a, b]); }
    }
  });
  queue = [nextTier(), nextTier()];
  held = queue.shift(); queue.push(nextTier());
  aimX = W / 2; canDropAt = 0; score = 0; merges = 0; maxTier = 0; combo = 0; lastMergeT = -1e9; gameOver = false; running = true;
  particles = []; floats = []; pending = []; shake = 0; dangerLevel = 0;
  best = store.get(m === 'daily' ? 'best_daily_' + todayKey() : 'best_endless', 0);
  $('menu').classList.add('hidden'); $('over').classList.add('hidden');
}

function critters() { return Composite.allBodies(engine.world).filter(b => b.label === 'critter'); }

function drop() {
  const now = performance.now();
  if (gameOver || held == null || now < canDropAt) return;
  const r = TIERS[held].r, x = Math.max(JAR.l + r + 1, Math.min(JAR.r - r - 1, aimX));
  Composite.add(engine.world, makeCritter(x, SPAWN_Y, held));
  sfx.drop();
  held = null; canDropAt = now + 420;
}

function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = speed * (.4 + Math.random()); particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 1, color, size: 3 + Math.random() * 4 }); }
}

function processMerges() {
  const now = performance.now();
  for (const [a, b] of pending) {
    const tier = a.tier, mx = (a.position.x + b.position.x) / 2, my = (a.position.y + b.position.y) / 2;
    Composite.remove(engine.world, a); Composite.remove(engine.world, b);
    combo = now - lastMergeT < 900 ? combo + 1 : 1; lastMergeT = now; merges++;
    let gained;
    if (tier === TOP) {
      gained = 300; burst(mx, my, '#ffd166', 60, 9); burst(mx, my, '#ff4757', 40, 6); shake = 14; sfx.ascend();
      floats.push({ x: W / 2, y: my - 40, text: 'DRAGON ASCENDS!', life: 1.8, color: '#ffd166', size: 30 });
    } else {
      const nt = tier + 1, nb = makeCritter(mx, my, nt, true);
      Body.setVelocity(nb, { x: (a.velocity.x + b.velocity.x) / 4, y: Math.min(0, (a.velocity.y + b.velocity.y) / 4) - 1 });
      Composite.add(engine.world, nb);
      gained = VALUE[nt];
      maxTier = Math.max(maxTier, nt);
      if (!(unlocked & (1 << nt))) { unlocked |= 1 << nt; store.set('unlocked', unlocked); floats.push({ x: W / 2, y: 300, text: `NEW: ${TIERS[nt].name.toUpperCase()}!`, life: 1.6, color: '#7ee0a0', size: 24 }); }
      burst(mx, my, TIERS[nt].color, 10 + nt * 2, 3 + nt * .4); shake = Math.max(shake, nt >= 5 ? 4 + nt * .6 : 0); sfx.merge(nt);
    }
    gained = Math.round(gained * (1 + (combo - 1) * .25));
    score += gained;
    floats.push({ x: mx, y: my - TIERS[tier].r, text: '+' + gained + (combo > 1 ? '  x' + combo : ''), life: 1, color: combo > 1 ? '#ffd166' : '#fff', size: combo > 1 ? 22 : 18 });
  }
  pending.length = 0;
}

function endGame() {
  if (gameOver) return;
  gameOver = true; running = false; sfx.over(); shake = 10;
  const key = mode === 'daily' ? 'best_daily_' + todayKey() : 'best_endless';
  const isBest = score > best;
  if (isBest) { best = score; store.set(key, score); }
  if (mode === 'daily') store.set('daily_' + todayKey(), { score: best, maxTier: Math.max(maxTier, (store.get('daily_' + todayKey(), {}).maxTier || 0)), merges });
  setTimeout(() => {
    $('overBadge').style.display = isBest && score > 0 ? '' : 'none';
    $('overTitle').textContent = maxTier === TOP ? 'DRAGON HATCHED!' : 'GAME OVER';
    $('overScore').textContent = score.toLocaleString();
    $('overMerges').textContent = merges + ' merges';
    $('overTop').textContent = 'Top: ' + TIERS[maxTier].name;
    $('overChain').textContent = chainText(maxTier);
    $('over').classList.remove('hidden');
  }, 700);
}

function chainText(top) { return TIERS.map((t, i) => i <= top ? t.emoji : '⬛').join(''); }
function shareText() {
  const head = mode === 'daily' ? `Hatchpile #${dailyNo}` : 'Hatchpile ∞';
  const line2 = maxTier === TOP ? '🐉 Dragon hatched!' : `Top critter: ${TIERS[maxTier].emoji} ${TIERS[maxTier].name}`;
  return `${head}\n${line2}\nScore ${score.toLocaleString()} · ${merges} merges\n${chainText(maxTier)}\n${location.href.split('#')[0]}`;
}
async function share() {
  const text = shareText();
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch { return; }
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard!'); } catch { toast('Copy failed'); }
}
let toastT; function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 1600); }

function refreshMenu() {
  dailyNo = dailyNumber();
  $('btnDaily').textContent = `Daily #${dailyNo}`;
  const d = store.get('daily_' + todayKey(), null);
  $('menuDaily').textContent = d ? `Today's best: ${d.score.toLocaleString()} · top ${TIERS[d.maxTier].name}` : 'Everyone gets the same eggs today. Beat your friends.';
  $('menuBest').textContent = 'Best: ' + store.get('best_endless', 0).toLocaleString();
  let n = 0; for (let i = 0; i <= TOP; i++) if (unlocked & (1 << i)) n++;
  $('menuDex').textContent = `Critterdex ${n}/${TIERS.length}`;
  $('btnMute').textContent = muted ? '🔇 Sound off' : '🔊 Sound on';
}

let scale = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + 'px'; canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize); resize();

function canvasX(e) { const r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / scale; }
function canvasY(e) { const r = canvas.getBoundingClientRect(); return (e.clientY - r.top) / scale; }
let aiming = false;
canvas.addEventListener('pointerdown', e => {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (!running) return;
  const x = canvasX(e), y = canvasY(e);
  if (x > W - 48 && y < 44) { muted = !muted; store.set('mute', muted); toast(muted ? 'Muted' : 'Sound on'); return; }
  aiming = true; aimX = x; try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', e => { if (running && (aiming || e.pointerType === 'mouse')) aimX = canvasX(e); });
canvas.addEventListener('pointerup', e => { if (aiming) { aimX = canvasX(e); aiming = false; drop(); } });
canvas.addEventListener('pointercancel', () => { aiming = false; });
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { muted = !muted; store.set('mute', muted); refreshMenu(); toast(muted ? 'Muted' : 'Sound on'); }
  if (!running) return;
  if (e.key === 'ArrowLeft') aimX -= 14;
  if (e.key === 'ArrowRight') aimX += 14;
  if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); drop(); }
});

$('btnDaily').onclick = () => startGame('daily');
$('btnEndless').onclick = () => startGame('endless');
$('btnAgain').onclick = () => startGame(mode);
$('btnMenu').onclick = () => { $('over').classList.add('hidden'); refreshMenu(); $('menu').classList.remove('hidden'); };
$('btnShare').onclick = share;
$('btnMute').onclick = () => { muted = !muted; store.set('mute', muted); refreshMenu(); };

function drawCritter(tier, x, y, angle, size, alpha = 1) {
  const img = sprites[tier], t = TIERS[tier];
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.globalAlpha = alpha;
  if (img.complete && img.naturalWidth && !img.failed) {
    const b = img.box || { x: 0, y: 0, s: img.naturalWidth };
    ctx.drawImage(img, b.x, b.y, b.s, b.s, -size / 2, -size / 2, size, size);
  }
  else {
    ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#0006'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = `${Math.max(10, size * .5)}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t.emoji, 0, 2);
  }
  ctx.restore();
}

const stars = Array.from({ length: 40 }, (_, i) => ({ x: (i * 97) % W, y: (i * 61) % 160, s: 1 + (i % 3) }));
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - last); last = now;
  if (engine && running) {
    acc += dt;
    while (acc >= 16.667) { Engine.update(engine, 16.667); acc -= 16.667; }
    processMerges();
    if (held == null && now >= canDropAt) { held = queue.shift(); queue.push(nextTier()); }
    dangerLevel = 0;
    for (const b of critters()) {
      if (b.position.y > H + 200) { Composite.remove(engine.world, b); continue; }
      const over = now - b.born > 700 && b.position.y - TIERS[b.tier].r < DANGER_Y && b.speed < .6;
      b.overT = over ? b.overT + dt : Math.max(0, b.overT - dt * 2);
      dangerLevel = Math.max(dangerLevel, b.overT / 1100);
      if (b.overT > 1100) endGame();
    }
  }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= dt / 700; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floats) { f.y -= dt * .04; f.life -= dt / 1000; }
  floats = floats.filter(f => f.life > 0);
  shake = Math.max(0, shake - dt * .05);
  render(now);
}

function render(now) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#241a40'); g.addColorStop(1, '#120c22');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#fff3e022'; for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);

  ctx.fillStyle = '#ffffff0a'; ctx.fillRect(JAR.l, JAR.top, JAR.r - JAR.l, JAR.floor - JAR.top);
  ctx.strokeStyle = '#6b58a6'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(JAR.l - 3, JAR.top - 10); ctx.lineTo(JAR.l - 3, JAR.floor + 3); ctx.lineTo(JAR.r + 3, JAR.floor + 3); ctx.lineTo(JAR.r + 3, JAR.top - 10); ctx.stroke();
  ctx.fillStyle = '#4a3a7a'; ctx.fillRect(JAR.l - 6, JAR.floor, JAR.r - JAR.l + 12, 10);

  const warn = Math.min(1, dangerLevel) * (0.6 + 0.4 * Math.sin(now / 80));
  ctx.strokeStyle = dangerLevel > 0 ? `rgba(255,94,122,${0.35 + warn * .65})` : 'rgba(255,255,255,.18)';
  ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(JAR.l, DANGER_Y); ctx.lineTo(JAR.r, DANGER_Y); ctx.stroke(); ctx.setLineDash([]);

  if (engine) for (const b of critters()) {
    const r = TIERS[b.tier].r; let size = r * 2;
    if (b.popped) { const age = now - b.born; if (age < 220) size *= 1 + .28 * Math.sin(age / 220 * Math.PI); }
    drawCritter(b.tier, b.position.x, b.position.y, b.angle, size);
  }

  if (running && held != null) {
    const r = TIERS[held].r, x = Math.max(JAR.l + r + 1, Math.min(JAR.r - r - 1, aimX));
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2; ctx.setLineDash([4, 10]);
    ctx.beginPath(); ctx.moveTo(x, SPAWN_Y + r); ctx.lineTo(x, JAR.floor); ctx.stroke(); ctx.setLineDash([]);
    drawCritter(held, x, SPAWN_Y + Math.sin(now / 300) * 3, 0, r * 2);
  }

  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2); ctx.font = `700 ${f.size}px 'Pixelify Sans',sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#000a'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'left'; ctx.fillStyle = '#fff3e0';
  ctx.font = `700 40px 'Pixelify Sans',sans-serif`; ctx.fillText((score || 0).toLocaleString(), 22, 34);
  ctx.font = `600 15px 'Pixelify Sans',sans-serif`; ctx.fillStyle = '#ffb347';
  ctx.fillText('BEST ' + (best || 0).toLocaleString(), 24, 64);
  ctx.fillStyle = '#fff3e099'; ctx.fillText(mode === 'daily' ? `DAILY #${dailyNo}` : mode === 'endless' ? 'ENDLESS' : '', 24, 84);
  if (running && combo > 1 && now - lastMergeT < 900) { ctx.fillStyle = '#ffd166'; ctx.font = `700 22px 'Pixelify Sans',sans-serif`; ctx.fillText('COMBO x' + combo, 24, 110); }

  ctx.fillStyle = '#ffffff10'; ctx.fillRect(W - 128, 14, 70, 70);
  ctx.strokeStyle = '#4a3a7a'; ctx.lineWidth = 2; ctx.strokeRect(W - 128, 14, 70, 70);
  ctx.fillStyle = '#fff3e099'; ctx.font = `600 12px 'Pixelify Sans',sans-serif`; ctx.textAlign = 'center'; ctx.fillText('NEXT', W - 93, 24);
  if (queue && queue.length) drawCritter(queue[0], W - 93, 54, 0, Math.min(44, TIERS[queue[0]].r * 2));
  ctx.font = '20px serif'; ctx.fillText(muted ? '🔇' : '🔊', W - 28, 26);

  const slotW = (W - 40) / TIERS.length, cy = 736;
  for (let i = 0; i < TIERS.length; i++) {
    const cx = 20 + slotW * (i + .5), got = unlocked & (1 << i);
    if (got) drawCritter(i, cx, cy, 0, 26, i <= maxTier || !running ? 1 : .4);
    else { ctx.fillStyle = '#ffffff14'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff3e055'; ctx.font = `700 14px 'Pixelify Sans',sans-serif`; ctx.fillText('?', cx, cy + 1); }
    if (i < TOP) { ctx.fillStyle = '#fff3e033'; ctx.fillRect(cx + slotW / 2 - 2, cy - 1, 4, 2); }
  }
  ctx.restore();
}

refreshMenu();
requestAnimationFrame(frame);
})();
</script>
