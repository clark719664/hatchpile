<style>
@font-face{font-family:'Hatchpile';src:url(assets/hatchpile.ttf) format('truetype');font-display:swap}
:root{--bg:#140d22;--ink:#fff3e0;--gold:#ffb347;--gold2:#ffd97a;--mint:#7ee0a0;--danger:#ff5e7a;--wood:#5a3a26;--wood2:#8a5a3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Hatchpile','Pixelify Sans',system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,18,.66);padding:14px;overflow:auto}
.overlay.hidden,.hidden{display:none}
.overlay.menu{align-items:flex-end;background:rgba(10,6,18,.42);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.overlay.menu .card{padding:10px 14px 10px}
.overlay.menu .hero{height:86px;margin:-4px auto 0}
.overlay.menu .hero .dragon{height:82px}
.overlay.menu .hero .egg{height:30px}
.overlay.menu h1{font-size:40px}
.overlay.menu .tag{margin:4px 0 8px;font-size:15px}
.overlay.menu .row{margin:6px 0 2px}
.overlay.menu .small{margin-top:4px}
#btnMore{margin-top:4px;font-size:13px;padding:5px 10px}
.card{position:relative;background:linear-gradient(#2b1d44,#1c1230);border:4px solid var(--wood2);outline:3px solid #2a1a10;box-shadow:inset 0 0 0 3px #3a2518,0 0 0 2px var(--gold) inset,0 16px 50px rgba(0,0,0,.6);border-radius:6px;padding:22px 18px 18px;width:min(380px,100%);text-align:center}
.card.panel{background:none;border:0;outline:0;box-shadow:none;border-image:url(assets/panel.png) 48 fill / 36px / 0 stretch;border-width:36px;border-style:solid;padding:6px 4px 4px;image-rendering:pixelated}
.hero{position:relative;height:120px;margin:-6px auto 2px;display:flex;align-items:flex-end;justify-content:center;gap:0}
.hero img{image-rendering:pixelated;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.hero .dragon{height:112px;animation:bob 2.6s ease-in-out infinite}
.hero .egg{height:40px;margin-left:-14px;margin-bottom:4px;animation:bob 2.6s ease-in-out -1.3s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
h1{font-size:46px;letter-spacing:3px;color:var(--gold2);text-shadow:0 3px 0 #8a4a1a,0 6px 0 #2a1208,0 0 24px rgba(255,180,70,.35);line-height:1.05;margin-top:4px}
h2{font-size:30px;color:var(--gold2);letter-spacing:2px;text-shadow:0 3px 0 #8a4a1a,0 5px 0 #2a1208}
.tag{font-size:17px;opacity:.9;margin:8px 0 14px;line-height:1.35}
.tag b{color:var(--gold)}
button{font:inherit;font-weight:700;font-size:20px;letter-spacing:1px;background:linear-gradient(#ffd27a,#f0a63a);color:#3a1d08;border:3px solid #2a1208;border-radius:6px;padding:11px 18px;margin:5px 3px;cursor:pointer;box-shadow:0 5px 0 #8a4a1a,inset 0 2px 0 #fff3b0;min-width:146px;text-shadow:0 1px 0 #ffe8b0}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #8a4a1a,inset 0 2px 0 #fff3b0}
button.alt{background:linear-gradient(#a7f0c0,#4fc47c);box-shadow:0 5px 0 #1f6b3e,inset 0 2px 0 #e0ffe8;color:#0b2e1b;text-shadow:0 1px 0 #d8ffe4}
button.alt:active{box-shadow:0 1px 0 #1f6b3e,inset 0 2px 0 #e0ffe8}
button.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid #6b58a6;font-size:15px;padding:7px 12px;min-width:0;text-shadow:none}
button.ghost:active{transform:translateY(2px)}
.big{font-size:52px;color:var(--gold2);line-height:1.1;text-shadow:0 3px 0 #8a4a1a,0 5px 0 #2a1208}
.row{display:flex;justify-content:center;gap:14px;font-size:14px;opacity:.9;margin:8px 0;flex-wrap:nowrap}
.row span{white-space:nowrap}
.small{font-size:13px;opacity:.65;margin-top:8px;line-height:1.45}
.badge{display:inline-block;background:var(--danger);color:#fff;font-size:13px;padding:3px 9px;border-radius:4px;margin-bottom:6px;letter-spacing:2px;border:2px solid #7a1a2e}
.cardimg{display:block;width:min(240px,70%);margin:8px auto 10px;border:3px solid #2a1208;outline:2px solid var(--gold);image-rendering:auto;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.dex{display:flex;justify-content:center;gap:3px;margin:8px 0 2px;flex-wrap:nowrap}
.dex span{width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;background:#0006;border-radius:50%;border:2px solid #3a2a5a}
.dex img{height:18px;image-rendering:pixelated}
.dex .lock{color:#fff5;font-size:12px}
.dex .hi{border-color:var(--gold);box-shadow:0 0 10px rgba(255,180,70,.5)}

<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="menu" class="overlay menu">
    <div class="card" id="menuCard">
      <div class="hero"><img class="dragon" src="assets/c10.png" alt=""><img class="egg" src="assets/c00.png" alt=""></div>
      <h1>HATCHPILE</h1>
      <div class="tag">Drop eggs. Merge critters. Hatch the <b>Dragon</b>.</div>
      <button id="btnDaily" class="alt">Daily #1</button>
      <button id="btnEndless">Endless</button>
      <div class="row"><span id="menuBest">Best: 0</span><span id="menuDexCount">Critterdex 1/11</span><span id="menuStreak"></span></div>
      <div id="menuDaily" class="small"></div>
      <div id="more" class="hidden">
        <div class="dex" id="menuDex"></div>
        <div class="row"><span id="menuDragons"></span><span id="menuCombo"></span></div>
        <div class="small">Drag to aim, release to drop · Golden eggs merge with anything up to a Boar<br>Keyboard: ← → Space · M mute</div>
        <button id="btnMusic" class="ghost">🎵 Music on</button> <button id="btnSfx" class="ghost">🔊 SFX on</button>
      </div>
      <button id="btnMore" class="ghost">Critterdex &amp; options ▾</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <div id="overBadge" class="badge" style="display:none">NEW BEST</div>
      <h2 id="overTitle">GAME OVER</h2>
      <div class="big" id="overScore">0</div>
      <div class="row"><span id="overMerges">0 merges</span><span id="overTop">Top: Egg</span></div>
      <img id="cardImg" class="cardimg" alt="Result card">
      <button id="btnShare" class="alt">Share</button>
      <button id="btnAgain">Play again</button>
      <div><button id="btnSave" class="ghost">Save card</button> <button id="btnMenu" class="ghost">Menu</button></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
(() => {
if (!window.Matter) { document.body.innerHTML = '<p style="padding:40px;text-align:center;font-family:sans-serif;color:#fff">Hatchpile needs an internet connection the first time it loads.</p>'; return; }
const { Engine, Bodies, Body, Composite, Events } = Matter;

const W = 440, H = 760;
const JAR = { l: 30, r: 410, top: 178, floor: 700 };
const DANGER_Y = 198, SPAWN_Y = 118, EPOCH = Date.UTC(2026, 9, 31);
const TIERS = [
  ['Egg', '🥚', 16, '#f3e9d2'], ['Slime', '🟢', 22, '#7ee0a0'], ['Shroomling', '🍄', 28, '#ff6b6b'],
  ['Bat', '🦇', 36, '#a77df2'], ['Frog', '🐸', 46, '#4fd1c5'], ['Cat', '🐱', 56, '#ffa94d'],
  ['Owl', '🦉', 66, '#c9a071'], ['Boar', '🐗', 78, '#8d6748'], ['Bear', '🐻', 90, '#a0522d'],
  ['Golem', '🗿', 104, '#8fa3b5'], ['Dragon', '🐉', 116, '#ff4757'],
].map(([name, emoji, r, color]) => ({ name, emoji, r, color }));
const TOP = TIERS.length - 1, GOLD = -1;
const GOLD_INFO = { name: 'Golden Egg', emoji: '🌟', r: 16, color: '#ffd700' };
const GOLD_CAP = 7; // a Golden Egg merges with anything up to a Boar; bigger critters just crack it into a plain Egg
let hatchGold = [];
const info = t => t === GOLD ? GOLD_INFO : TIERS[t];
const VALUE = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66];
const FONT = `'Hatchpile','Pixelify Sans',sans-serif`;

const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d');
const store = {
  get(k, d) { try { const v = localStorage.getItem('hp_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hp_' + k, JSON.stringify(v)); } catch {} },
};
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const pad = n => String(n).padStart(2, '0');
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dailyNumber() { const d = new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 864e5) + 1; }

function trimBox(img) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
  for (let py = 0; py < c.height; py++) for (let px = 0; px < c.width; px++) if (d[(py * c.width + px) * 4 + 3] > 20) {
    if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py;
  }
  if (maxX < 0) return { x: 0, y: 0, s: c.width };
  const w = maxX - minX + 1, h = maxY - minY + 1, s = Math.max(w, h);
  return { x: minX - (s - w) / 2, y: minY - (s - h) / 2, s };
}
function loadSprite(src) {
  const img = new Image(); img.src = src;
  img.onerror = () => { img.failed = true; };
  img.onload = () => { try { img.box = trimBox(img); } catch { img.box = { x: 0, y: 0, s: img.naturalWidth }; } };
  return img;
}
const sprites = TIERS.map((t, i) => loadSprite(`assets/c${pad(i)}.png`));
const goldSprite = loadSprite('assets/gold.png');
const bgImg = new Image(); bgImg.src = 'assets/bg.png';
const spr = t => t === GOLD ? goldSprite : sprites[t];
function unionBox(img) {
  const fh = img.naturalHeight, c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = fh;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, fh).data;
  let minX = fh, minY = fh, maxX = -1, maxY = -1;
  for (let py = 0; py < fh; py++) for (let px = 0; px < c.width; px++) if (d[(py * c.width + px) * 4 + 3] > 20) {
    const cx = px % fh; if (cx < minX) minX = cx; if (cx > maxX) maxX = cx; if (py < minY) minY = py; if (py > maxY) maxY = py;
  }
  if (maxX < 0) return { x: 0, y: 0, s: fh };
  const w = maxX - minX + 1, h = maxY - minY + 1, s = Math.max(w, h);
  return { x: minX - (s - w) / 2, y: minY - (s - h) / 2, s };
}
function loadSheet(src) {
  const img = new Image(); img.src = src;
  img.onerror = () => { img.failed = true; };
  img.onload = () => { try { img.frames = Math.max(1, Math.round(img.naturalWidth / img.naturalHeight)); img.box = unionBox(img); img.ready = true; } catch { img.failed = true; } };
  return img;
}
const sheets = TIERS.map((t, i) => loadSheet(`assets/a${pad(i)}.png`));
const goldSheet = loadSheet('assets/agold.png');
const sheetOf = t => t === GOLD ? goldSheet : sheets[t];
const FRAME_MS = 115;

/* ---------- audio: sfx + chiptune loop ---------- */
let audioCtx = null, master = null, musicBus = null, sfxBus = null, muted = store.get('mute', false), musicOn = store.get('music', true), sfxOn = store.get('sfx', true);
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(audioCtx.destination);
    musicBus = audioCtx.createGain(); musicBus.gain.value = musicOn ? 1 : 0; musicBus.connect(master);
    sfxBus = audioCtx.createGain(); sfxBus.gain.value = sfxOn ? 1 : 0; sfxBus.connect(master);
    music.start();
  } catch {}
}
function setMuted(m) { muted = m; store.set('mute', m); if (master) master.gain.setTargetAtTime(m ? 0 : 1, audioCtx.currentTime, .02); }
function setMusic(v) { musicOn = v; store.set('music', v); if (musicBus) musicBus.gain.setTargetAtTime(v ? 1 : 0, audioCtx.currentTime, .02); }
function setSfx(v) { sfxOn = v; store.set('sfx', v); if (sfxBus) sfxBus.gain.setTargetAtTime(v ? 1 : 0, audioCtx.currentTime, .02); }
function tone(freq, dur, type = 'triangle', vol = 0.18, slide = 1, when = 0, bus = 'sfx') {
  if (!audioCtx || (bus === 'sfx' && mode === 'demo')) return;
  const t = audioCtx.currentTime + when, o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(bus === 'music' ? musicBus : sfxBus); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = .12, when = 0, bus = 'sfx') {
  if (!audioCtx || (bus === 'sfx' && mode === 'demo')) return;
  const n = audioCtx.sampleRate * dur, buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = audioCtx.createBufferSource(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 900; s.buffer = buf; g.gain.value = vol;
  s.connect(f).connect(g).connect(bus === 'music' ? musicBus : sfxBus); s.start(audioCtx.currentTime + when);
}
const sfx = {
  drop() { tone(200, 0.07, 'square', 0.06, 0.5); },
  land() { noise(0.05, .05); },
  merge(tier) { tone(240 * Math.pow(1.14, tier), 0.18, 'triangle', 0.2, 1.6); tone(240 * Math.pow(1.14, tier) * 1.5, 0.12, 'square', 0.05, 1.3, .04); if (tier >= 5) tone(120 * Math.pow(1.14, tier), 0.3, 'sine', 0.16, 1.2); },
  gold() { [0, 4, 7].forEach((n, i) => tone(660 * Math.pow(2, n / 12), 0.2, 'square', 0.07, 1.01, i * .05)); },
  breath() { noise(0.6, .25); tone(90, 0.6, 'sawtooth', 0.12, 0.4); },
  ascend() { [0, 4, 7, 12, 16, 19, 24].forEach((n, i) => tone(330 * Math.pow(2, n / 12), 0.35, 'triangle', 0.2, 1.02, i * .08)); },
  over() { [0, -4, -9, -14].forEach((n, i) => tone(220 * Math.pow(2, n / 12), 0.4, 'sawtooth', 0.1, 0.9, i * .2)); },
};
const music = (() => {
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const leadA = [69, 72, 74, 76, 72, 74, 69, 0, 76, 74, 72, 74, 69, 0, 67, 0, 72, 74, 76, 79, 76, 74, 72, 0, 69, 72, 74, 72, 69, 67, 64, 0];
  const leadB = [76, 79, 81, 79, 76, 74, 72, 0, 74, 76, 74, 72, 69, 0, 72, 0, 79, 81, 84, 81, 79, 76, 74, 0, 76, 74, 72, 74, 69, 0, 0, 0];
  const bass = [45, 0, 0, 45, 0, 0, 48, 0, 48, 0, 0, 48, 0, 0, 43, 0, 43, 0, 0, 43, 0, 0, 40, 0, 40, 0, 0, 40, 0, 0, 45, 0];
  const bpm = 118, step = 60 / bpm / 2;
  let next = 0, i = 0, timer = null, started = false;
  function tick() {
    if (next < audioCtx.currentTime - .3) next = audioCtx.currentTime + .05;
    while (next < audioCtx.currentTime + .25) {
      const s = i % 32, lead = Math.floor(i / 32) % 4 === 3 ? leadB : leadA, w = next - audioCtx.currentTime;
      if (lead[s]) tone(midi(lead[s]), step * .8, 'square', 0.028, 1, w, 'music');
      if (bass[s]) tone(midi(bass[s]), step * 1.6, 'triangle', 0.07, 1, w, 'music');
      if (s % 4 === 2) noise(0.03, .018, w, 'music');
      next += step; i++;
    }
  }
  return { start() { if (started || !audioCtx) return; started = true; next = audioCtx.currentTime + .1; timer = setInterval(tick, 100); } };
})();

/* ---------- state ---------- */
let engine, mode, rng, queue, qIndex, held, aimX, canDropAt, score, best, merges, maxTier, combo, bestCombo = 0, lastMergeT, gameOver, running, dropsMade;
let particles = [], floats = [], rings = [], ghosts = [], timers = [], pending = [], shake = 0, flash = 0, dangerLevel = 0, dailyNo = dailyNumber(), shownScore = 0, walls = [], collapseUntil = 0;
function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function streakNow() { const s = store.get('streak', { count: 0, last: '' }); return (s.last === todayKey() || s.last === yesterdayKey()) ? s.count : 0; }
const isTouch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
let unlocked = store.get('unlocked', 1), cardCanvas = null;

function nextTier() {
  const g = rng(), r = rng(); qIndex++;
  if (qIndex > 15 && g < 0.045) return GOLD;
  return r < .34 ? 0 : r < .62 ? 1 : r < .82 ? 2 : r < .94 ? 3 : 4;
}
function makeCritter(x, y, tier, popped) {
  const b = Bodies.circle(x, y, info(tier).r, { restitution: .1, friction: .32, frictionStatic: .5, density: .0012, label: 'critter' });
  b.tier = tier; b.born = performance.now(); b.overT = 0; b.popped = !!popped; b.squash = 0; b.phase = Math.random() * 6.28;
  Body.setAngle(b, (rng() - .5) * .6);
  return b;
}

function startGame(m) {
  mode = m;
  const seed = m === 'daily' ? hashStr('hatchpile-' + todayKey()) : (Math.random() * 2 ** 32) >>> 0;
  rng = mulberry32(seed); qIndex = 0;
  engine = Engine.create({ gravity: { x: 0, y: 1.15 } });
  const wallOpts = { isStatic: true, friction: .4, label: 'wall' };
  const floorY = JAR.floor;
  walls = [
    Bodies.rectangle(JAR.l - 20, (JAR.top + JAR.floor) / 2 - 150, 40, JAR.floor - JAR.top + 500, wallOpts),
    Bodies.rectangle(JAR.r + 20, (JAR.top + JAR.floor) / 2 - 150, 40, JAR.floor - JAR.top + 500, wallOpts),
    Bodies.rectangle(W / 2, floorY + 20, W + 200, 40, wallOpts),
  ];
  Composite.add(engine.world, walls);
  Events.on(engine, 'collisionStart', e => {
    for (const { bodyA: a, bodyB: b } of e.pairs) {
      const sp = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
      for (const c of [a, b]) if (c.label === 'critter' && sp > 2.5) {
        c.squash = Math.max(c.squash, Math.min(1, sp / 9));
        if (sp > 5) { burst(c.position.x, c.position.y + info(c.tier).r * .8, '#d9c7a8', 4, 1.2, .5); sfx.land(); }
      }
      if (a.label !== 'critter' || b.label !== 'critter' || a.dead || b.dead) continue;

  const gl = ctx.createLinearGradient(JAR.l, 0, JAR.r, 0); gl.addColorStop(0, 'rgba(255,255,255,.10)'); gl.addColorStop(.12, 'rgba(255,255,255,0)'); gl.addColorStop(.85, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,.07)');
  ctx.fillStyle = gl; ctx.fillRect(JAR.l, JAR.top, JAR.r - JAR.l, JAR.floor - JAR.top);
  ctx.strokeStyle = 'rgba(190,210,255,.55)'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(JAR.l - 2, JAR.top - 14); ctx.lineTo(JAR.l - 2, JAR.floor + 2); ctx.lineTo(JAR.r + 2, JAR.floor + 2); ctx.lineTo(JAR.r + 2, JAR.top - 14); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(JAR.l + 10, JAR.top + 10); ctx.lineTo(JAR.l + 10, JAR.floor - 40); ctx.stroke();
  ctx.fillStyle = '#3a2518'; ctx.fillRect(JAR.l - 12, JAR.floor + 2, JAR.r - JAR.l + 24, 14);
  ctx.fillStyle = '#8a5a3a'; ctx.fillRect(JAR.l - 12, JAR.floor + 2, JAR.r - JAR.l + 24, 4);
  ctx.fillStyle = '#5a3a26'; ctx.fillRect(JAR.l - 16, JAR.top - 22, JAR.r - JAR.l + 32, 10); ctx.fillStyle = '#b07a4a'; ctx.fillRect(JAR.l - 16, JAR.top - 22, JAR.r - JAR.l + 32, 3);
  ctx.globalAlpha = 1;

  const warn = Math.min(1, dangerLevel) * (0.6 + 0.4 * Math.sin(now / 80));
  ctx.strokeStyle = dangerLevel > 0 ? `rgba(255,94,122,${0.35 + warn * .65})` : 'rgba(255,255,255,.2)';
  ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(JAR.l, DANGER_Y); ctx.lineTo(JAR.r, DANGER_Y); ctx.stroke(); ctx.setLineDash([]);

  if (engine) for (const b of critters()) {
    const r = info(b.tier).r; let size = r * 2;
    if (b.popped) { const age = now - b.born; if (age < 120) size *= .25 + 1.05 * (age / 120); else if (age < 280) size *= 1.3 - .3 * ((age - 120) / 160); }
    const breathe = 1 + .012 * Math.sin(now / 420 + b.phase);
    if (b.tier === GOLD) { ctx.save(); ctx.globalAlpha = .35 + .2 * Math.sin(now / 150); ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r + 6, 0, 7); ctx.fill(); ctx.restore(); }
    drawCritter(b.tier, b.position.x, b.position.y, b.angle, size, 1, b.squash, breathe, Math.max(0, Math.min(.18, (b.velocity.y - 5) / 45)), now + b.phase * 1000);
  }

  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life) * .9; ctx.strokeStyle = r.color; ctx.lineWidth = 4 * r.life + 1; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;

  if (running && held != null) {
    const r = info(held).r, x = Math.max(JAR.l + r + 1, Math.min(JAR.r - r - 1, aimX));
    const lg = ctx.createLinearGradient(0, SPAWN_Y, 0, JAR.floor); lg.addColorStop(0, 'rgba(255,220,150,.16)'); lg.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = lg; ctx.fillRect(x - r, SPAWN_Y, r * 2, JAR.floor - SPAWN_Y);
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.setLineDash([4, 10]); ctx.beginPath(); ctx.moveTo(x, SPAWN_Y + r); ctx.lineTo(x, JAR.floor); ctx.stroke(); ctx.setLineDash([]);
    if (held === GOLD) { ctx.save(); ctx.globalAlpha = .4 + .2 * Math.sin(now / 150); ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(x, SPAWN_Y, r + 8, 0, 7); ctx.fill(); ctx.restore(); }
    if (mode !== 'demo') drawCritter(held, x, landingY(x, r), 0, r * 2, .22);
    drawCritter(held, x, SPAWN_Y + Math.sin(now / 300) * 3, 0, r * 2, 1, 0, 1 + .03 * Math.sin(now / 200));
  }

  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life * 2); text(f.text, f.x, f.y, f.size, f.color, 'center'); }
  ctx.globalAlpha = 1;

  if (dangerLevel > 0) { const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .8); v.addColorStop(0, 'rgba(255,40,80,0)'); v.addColorStop(1, `rgba(255,40,80,${.55 * Math.min(1, dangerLevel) * (0.7 + 0.3 * Math.sin(now / 90))})`); ctx.fillStyle = v; ctx.fillRect(FX, FY, FW, FH); }
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,200,${flash * .55})`; ctx.fillRect(FX, FY, FW, FH); }
  if (running && mode !== 'demo' && dropsMade === 0 && store.get('games', 0) < 3) { ctx.globalAlpha = .7 + .3 * Math.sin(now / 250); text(isTouch ? 'DRAG TO AIM · RELEASE TO DROP' : 'MOVE TO AIM · CLICK TO DROP', W / 2, 330, 18, '#ffd97a', 'center'); ctx.globalAlpha = 1; }
  for (const g of ghosts) { const p = Math.min(1, g.t / 110), e = 1 - (1 - p) * (1 - p); drawCritter(g.tier, g.x + (g.tx - g.x) * e, g.y + (g.ty - g.y) * e, g.angle, info(g.tier).r * 2 * (1 - .5 * e), 1 - e * .6); }

  /* HUD */
  if (!mode || mode === 'demo') { ctx.restore(); return; }
  text(Math.round(shownScore).toLocaleString(), 22, 36, 42 + Math.min(10, (score - shownScore) / 8), '#ffd97a');
  text('BEST ' + (best || 0).toLocaleString(), 24, 68, 15, '#ffb347');
  text(mode === 'daily' ? `DAILY #${dailyNo}` : mode === 'endless' ? 'ENDLESS' : '', 24, 88, 14, '#fff3e0');
  if (running && combo > 1 && now - lastMergeT < 900) text('COMBO x' + combo, 24, 114, 22, '#ffd166');
  ctx.fillStyle = 'rgba(10,6,22,.7)'; ctx.fillRect(W - 130, 12, 74, 74); ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 3; ctx.strokeRect(W - 130, 12, 74, 74); ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 1; ctx.strokeRect(W - 127, 15, 68, 68);
  text('NEXT', W - 93, 24, 12, '#ffb347', 'center');
  if (queue && queue.length) drawCritter(queue[0], W - 93, 56, 0, Math.min(44, info(queue[0]).r * 2));
  ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.fillText(muted ? '🔇' : '🔊', W - 28, 28);

  /* chain bar */
  ctx.fillStyle = 'rgba(10,6,22,.6)'; ctx.fillRect(0, 716, W, 44);
  const slotW = (W - 30) / TIERS.length, cy = 738;
  for (let i = 0; i < TIERS.length; i++) {
    const cx = 15 + slotW * (i + .5), got = unlocked & (1 << i);
    if (running && i === maxTier && i > 0) { ctx.fillStyle = 'rgba(255,180,70,.25)'; ctx.beginPath(); ctx.arc(cx, cy, 17, 0, 7); ctx.fill(); }
    if (got) drawCritter(i, cx, cy, 0, 26, i <= maxTier || !running ? 1 : .4);
    else { ctx.fillStyle = '#ffffff14'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill(); text('?', cx, cy + 1, 14, '#fff3e088', 'center', 700, false); }
    if (i < TOP) { ctx.fillStyle = '#fff3e033'; ctx.fillRect(cx + slotW / 2 - 2, cy - 1, 4, 2); }
  }
  ctx.restore();
}

refreshMenu();
requestAnimationFrame(frame);
const startDemo = () => { if (!mode || mode === 'demo') startGame('demo'); };
window.addEventListener('load', () => { setTimeout(startDemo, 150); (document.fonts && document.fonts.ready || Promise.resolve()).then(() => setTimeout(startDemo, 50)); });
if (document.readyState === 'complete') setTimeout(startDemo, 150); else setTimeout(startDemo, 1500);
if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
